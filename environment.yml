name: msbench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ninja
  - cmake>=3.20
  - pytorch>=2.0.0
  - torchvision
  - pytorch-cuda=11.8
  # Runtime packages alone do not include the compiler or CUDA headers.
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - cuda-cccl=11.8
  - cuda-driver-dev=11.8
  - cuda-nvtx=11.8
  - setuptools>=68
  - wheel
  - pip:
      - numpy<2.0.0
      - Pillow
      - imageio[ffmpeg]
      - opencv-python
      - scipy
      - trimesh
      - pytorch-msssim
      - lpips
      - typer>=0.9
      - pyyaml
      - rich
      - tabulate
      - tensorboard
      - torchmetrics
      - shapely
      - plyfile
      - open3d==0.19.0
      - scikit-image
      - scikit-learn
      - matplotlib
      - mediapy
      - nanobind>=2.11.0
      # Install the project after activation as documented in README.md,
      # so its build uses this environment's PyTorch and CUDA toolkit.
