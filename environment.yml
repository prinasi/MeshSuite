name: msbench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ninja
  - cmake>=3.20
  - pytorch>=2.0.0
  - torchvision
  - pytorch-cuda=11.8
  # Runtime packages alone do not include the compiler or CUDA headers.
  - cuda-nvcc=11.8
  - cuda-cudart-dev=11.8
  - cuda-cccl=11.8
  - cuda-driver-dev=11.8
  - cuda-nvtx=11.8
  - setuptools>=68
  - wheel
  - pip:
      - numpy<2.0.0
      # Python-only install; build the CUDA extensions after activation as
      # documented in README.md, so they use this environment's PyTorch and CUDA toolkit.
      - -e .[runtime,cuda,method-2dts,method-triangle-splatting,method-mesh-splatting,method-diffsoup,geometry]
