name: msbench
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ninja
  - cmake>=3.20
  - pytorch>=2.0.0
  - torchvision
  - pytorch-cuda=11.8
  - pip:
      - numpy<2.0.0
      - -e .[runtime,cuda,method-2dts,method-triangle-splatting,method-mesh-splatting,method-diffsoup,geometry]
