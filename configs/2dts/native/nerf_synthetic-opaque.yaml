# Mesh-oriented 2DTS on NeRF-Synthetic (`2dts --opaque`). The paper evaluates its mesh setting on
# this dataset (arXiv v3 Sec. 4.3): one 30K run from the initial point cloud, gamma 1 for 20K and
# then 1 to 50 over 10K, the opacity straight-through estimator from start to end, geometric losses
# on, SH degree 3. Upstream (GaodeRender/triangle-splatting eef0120) instead runs NeRF-Synthetic in
# two stages, NerfSynthetic_VanillaTS.yaml for 30K and then NerfSynthetic_VanillaTS_mesh.yaml from
# its 30K point cloud to 60K, which is the 60K schedule of the paper's v1/v2.
#
# This preset follows tandt-opaque.yaml, the paper's schedule on the authors' single-run mesh
# preset, and takes the settings upstream's NeRF-Synthetic presets set differently from their
# Tanks & Temples ones:
# - Dataset: NerfSynthetic with points3d.ply, random training and white test background
#   (NerfSynthetic_VanillaTS.yaml, as nerf_synthetic.yaml).
# - densification.max_grow_ratio 0.01 and scale_pruning radii_threshold -1, scale_threshold 0.5
#   (both NeRF-Synthetic presets).
# - Geometric losses from 3K with w_distortion 0.05, and opacity_reg from 3K (quad; weight 0)
#   (NerfSynthetic_VanillaTS_mesh.yaml).
# Not taken from the mesh preset:
# - Its second-stage settings (start_pointcloud 30K, no densification or opacity reset, statistic
#   and pruning from 30K, contribution pruning to per-scene triangle targets), which have no
#   counterpart in a single run; contribution pruning keeps the thresholds of the single-run preset.
# - render_spp 2 (training at 2x2 supersampling): MeshSuite's de facto 2DTS renderer draws one
#   sample per pixel, so the model would be trained for a renderer it is not evaluated with.
# As for the other datasets, the densification budget is the 2dts scene config's
# d2ts.target_point_num, and no geometry is scored on this dataset.
lr_delay_steps: &LR_DELAY_STEPS 2_000
lr_delay_mult: &LR_DELAY_MULT 1.0
lr_max_steps: &LR_MAX_STEPS 20_000
total_iter: &TOTAL_ITER 30_000
solidify_start_iter: &SOLIDIFY_START_ITER 20_000
solidify_end_iter: &SOLIDIFY_END_ITER 30_000

dataset:
    type: "NerfSynthetic"
    local_dir: null
    scene_id: null
    background: "random"
    test_background: "white"
    num_workers: 10

    pcd_path: "points3d.ply"
    train_target_res: null
    test_target_res: null
    hold_test_set: True # the official test split

model:
    max_sh_degree: 3
    use_color_affine: False
    back_culling: False
    use_vertex_color: False
    gamma_rescale: True
    sort_level: 2 # 0: per triangle, 1: per tile, 2: per pixel
    ste_threshold: 0.3

    sampling:
        sample_method: "direct" # "random" | "grid" | "direct"
        init_opacity: 0.5 # float | "random"

    optimizer:
        vertex:
            v_init: 0.0012
            v_final: 0.00002
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        opacity:
            v_init: 0.05
            v_final: 0.001
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        f_dc:
            v_init: 0.001
            v_final: 0.001
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        f_rest:
            v_init: 0.0002
            v_final: 0.0002
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

    model_update:
        statistic:
            start_iter: 0
            end_iter: *TOTAL_ITER

        densification:
            start_iter: 500
            end_iter: 15_000
            interval_iter: 100
            grad_threshold_init: 0.0002
            grad_threshold_final: 0.0002
            target_point_num: null
            grow_ratio: 0.04
            max_grow_ratio: 0.01
            min_view_count: 10
            split_scale_threshold: 0.01 # unit: m, proportional to scene extent
            split_num: 4 # 2 | 3 | 4

        contribution_pruning:
            start_iter: 0
            end_iter: *TOTAL_ITER
            interval_iter: -1 # -1 means train_dataset.size
            min_view_count: 0
            contrib_max_threshold: 0.01
            contrib_sum_threshold: 2.0

        # opacity_pruning:
        #     start_iter: 3_000
        #     end_iter: 15_000
        #     hold_iter: 15_000
        #     interval_iter: 200
        #     opacity_threshold_init: 0.005
        #     opacity_threshold_final: 0.005

        scale_pruning:
            start_iter: 3_000
            end_iter: *TOTAL_ITER
            interval_iter: 200
            radii_threshold: -1 # int means pixel, -1 means max(image_width, image_height), float means fraction of max(image_width, image_height)
            scale_threshold: 0.5 # unit: m, proportional to scene extent

        opacity_reset:
            start_iter: 0
            end_iter: 15_000
            interval_iter: 3000
            reset_value: 0.29

        gamma_schedule:
            start_iter: *SOLIDIFY_START_ITER
            end_iter: *SOLIDIFY_END_ITER
            gamma_init: 1.0
            gamma_final: 50.0

        sh_schedule:
            one_up_iters: [1000, 2000, 3000]

trainer:
    output_dir: "outputs/NerfSynthetic/VanillaTS"
    clean_output_dir: False # clean output_dir before training
    detect_anomaly: False
    seed: null
    use_tensorboard: True
    save_train_img: True
    save_eval_img: False

    start_checkpoint: null
    start_pointcloud: null
    initial_eval: False
    iterations: *TOTAL_ITER
    batch_size: 1
    log_interval_iter: 200
    eval_interval_iter: 2_000
    histogram_interval_iter: 5_000
    save_interval_iter: 0
    ckpt_interval_iter: 0
    save_iterations: [*SOLIDIFY_START_ITER, *TOTAL_ITER]
    checkpoint_iterations: []
    save_mesh_iterations: [*TOTAL_ITER]
    save_pcd_iterations: null # no geometry metric on this dataset

    train_background: null # "white" | "black" | "random" | null, if null, use dataset background
    eval_background: null # "white" | "black" | "random" | null, if null, use dataset background
    train_alpha_mask: False
    eval_alpha_mask: False

    w_L1: 0.8
    w_L2: 0.0
    w_ssim: 0.2
    w_dog: 0.0
    smoothness_loss:
        w_image: 0.0
        w_normal: 0.05
        w_depth: 0.0
        start_iter: 3_000
    geometry_loss:
        w_geometry: 0.05
        scale_factor: null
        start_iter: 3_000
    distortion_loss:
        w_distortion: 0.05
        start_iter: 3_000

    w_scaling_reg: 0.0
    w_affine_reg: 0.0
    opacity_reg:
        w_opacity_reg: 0.0 # -0.01
        start_iter: 3_000
        type: "quad" # "quad" | "linear"
    vertex_reg:
        w_vertex_reg: 0.0
        start_iter: 0
        interval_iter: 10

    eval_save_img_count: 3
    histogram_sample_num: 10_000
