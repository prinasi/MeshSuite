_base_: exmesh.yaml

preprocess:
  type: exmesh_2dgs
  source_repo: outputs/exmesh-preprocess/2dgs_source
  output: outputs/exmesh-preprocess/{scene}-benchmark
  holdout: 8

dataset:
  name: dtu
  type: dtu
  root: data/DTU
  resolution: 2
  eval_split: true
  eval_every: 8
  dtu_eval_mode: foreground
  background: white
  use_alpha: true

trainer:
  dataset_type: dtu
  eval_split: true
  white_background: true
  initial_mesh: outputs/exmesh-preprocess/{scene}-benchmark/model/mesh/tsdf_fusion_post.ply

output:
  dir: outputs/exmesh/benchmark/dtu/{scene}
  metrics_file: outputs/exmesh/benchmark/dtu/{scene}/metrics.json
  mesh_metrics_file: outputs/exmesh/benchmark/dtu/{scene}/mesh_metrics.json
  mesh_file: outputs/exmesh/benchmark/dtu/{scene}/mesh/mesh.ply
  stats_file: outputs/exmesh/benchmark/dtu/{scene}/stats.json
  report_file: outputs/exmesh/benchmark/dtu/{scene}/report.md

adapter:
  checkpoint: outputs/exmesh/benchmark/dtu/{scene}/ckpt/final.pt
  render_params:
    bg_color: white

mesh:
  output: outputs/exmesh/benchmark/dtu/{scene}/mesh/mesh.ply

inspect:
  output: outputs/exmesh/benchmark/dtu/{scene}/stats.json

profile:
  output: outputs/exmesh/benchmark/dtu/{scene}/profile.json

render:
  video:
    output_dir: outputs/exmesh/benchmark/dtu/{scene}/video
