_base_: exmesh.yaml

paper_protocol:
  source: https://arxiv.org/html/2606.07288
  algorithm: author_code
  # Paper Sec. 4.1: 2DGS 7k iterations + TSDF at 256^3; Sec. 4.2: images at 800x600.
  initialization: 2dgs
  initialization_iterations: 7000
  tsdf_resolution: 256
  # Not stated in the paper; taken from the official repo's DTU script.
  unpublished_details: [black_background, per_scene_lambdas, position_lr_schedule]

# Reproduction protocol: the paper's ExMesh DTU setup (half resolution, 2DGS
# initialization) with the official black background, evaluated on the foreground
# of held-out views. 2DGS uses the same holdout, so the initial mesh never sees them.
preprocess:
  type: exmesh_2dgs
  source_repo: outputs/exmesh-preprocess/2dgs_source
  output: outputs/exmesh-preprocess/{scene}-reproduction
  holdout: 8

dataset:
  name: dtu
  type: colmap
  root: data/dtu
  resolution: 2
  eval_split: true
  eval_every: 8
  dtu_eval_mode: foreground
  background: black
  use_alpha: true

trainer:
  dataset_type: colmap
  eval_split: true
  llffhold: 8
  white_background: false
  lambda_depth: 0.1
  lambda_smooth: 3000
  lambda_deviation: 10000
  initial_mesh: outputs/exmesh-preprocess/{scene}-reproduction/model/mesh/tsdf_fusion_post.ply

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/{scene}/video
eval:
  split: test

output:
  dir: outputs/exmesh/reproduction/dtu/{scene}
  metrics_file: outputs/exmesh/reproduction/dtu/{scene}/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/{scene}/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/{scene}/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/{scene}/stats.json
  report_file: outputs/exmesh/reproduction/dtu/{scene}/report.md
adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/{scene}/ckpt/final.pt
mesh:
  output: outputs/exmesh/reproduction/dtu/{scene}/mesh/mesh.ply
inspect:
  output: outputs/exmesh/reproduction/dtu/{scene}/stats.json
profile:
  split: test
  output: outputs/exmesh/reproduction/dtu/{scene}/profile.json
