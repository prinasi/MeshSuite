_base_: exmesh.yaml

paper_protocol:
  source: https://arxiv.org/html/2606.07288
  algorithm: author_code
  unpublished_details: official_pgsr_dtu_defaults
  initialization_iterations: 5000
  tsdf_voxel_size: 0.01

# User-selected paper settings; unpublished details use recorded official defaults.
preprocess:
  type: exmesh_pgsr
  source_repo: outputs/exmesh-preprocess/pgsr_source
  output: outputs/exmesh-preprocess/dtu_pgsr/{scene}
  holdout: 0

dataset:
  name: dtu
  type: colmap
  root: data/dtu
  resolution: 1
  eval_split: false
  dtu_eval_mode: full
  background: black
  use_alpha: true

trainer:
  max_steps: 10000
  dataset_type: colmap
  eval_split: false
  white_background: false
  lambda_depth: 0.1
  lambda_smooth: 3000
  lambda_deviation: 10000
  initial_mesh: data/dtu/{scene}/mesh.ply

render:
  split: all
  video:
    output_dir: outputs/exmesh/dtu/{scene}/video
eval:
  split: all

output:
  dir: outputs/exmesh/dtu/{scene}
  metrics_file: outputs/exmesh/dtu/{scene}/metrics.json
  mesh_metrics_file: outputs/exmesh/dtu/{scene}/mesh_metrics.json
  mesh_file: outputs/exmesh/dtu/{scene}/mesh/mesh.ply
  stats_file: outputs/exmesh/dtu/{scene}/stats.json
  report_file: outputs/exmesh/dtu/{scene}/report.md
adapter:
  checkpoint: outputs/exmesh/dtu/{scene}/ckpt/final.pt
mesh:
  output: outputs/exmesh/dtu/{scene}/mesh/mesh.ply
inspect:
  output: outputs/exmesh/dtu/{scene}/stats.json
profile:
  split: all
  output: outputs/exmesh/dtu/{scene}/profile.json

