# @format

# DTU trainer defaults read by Triangle Splatting and MeshSplatting
# (msbench/cli/train.py). Kept out of dtu.yaml so the dataset base only holds
# the shared protocol that every method inherits.
trainer:
  depth_ratio: 1.0
  lambda_normals: 0.0028
  lambda_dist: 0.014
  iteration_mesh: 25000
  lambda_opacity: 0.0044
  importance_threshold: 0.027
  lr_triangles_points_init: 0.0015
  lambda_size: 0.0
  no_dome: true
