_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan40

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.03

eval:
  mesh:
    scan_id: 40
    scene_root: data/dtu/scan40

output:
  dir: outputs/exmesh/reproduction/dtu/scan40
  metrics_file: outputs/exmesh/reproduction/dtu/scan40/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan40/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan40/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan40/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan40/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan40/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan40/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan40/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan40/profile.json

render:
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan40/video
