_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan110
  dtu_eval_mode: foreground
  eval_split: true
  eval_every: 8

trainer:
  lambda_smooth: 1000
  lambda_depth: 0.01

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan110/video

eval:
  split: test
  mesh:
    scan_id: 110
    scene_root: data/dtu/scan110

output:
  dir: outputs/exmesh/reproduction/dtu/scan110
  metrics_file: outputs/exmesh/reproduction/dtu/scan110/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan110/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan110/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan110/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan110/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan110/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan110/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan110/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan110/profile.json
