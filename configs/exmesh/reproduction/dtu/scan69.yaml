_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan69

trainer:
  lambda_smooth: 1000
  lambda_depth: 0.1

eval:
  mesh:
    scan_id: 69
    scene_root: data/dtu/scan69

output:
  dir: outputs/exmesh/reproduction/dtu/scan69
  metrics_file: outputs/exmesh/reproduction/dtu/scan69/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan69/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan69/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan69/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan69/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan69/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan69/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan69/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan69/profile.json

render:
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan69/video
