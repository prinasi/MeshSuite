_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan65

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.01

eval:
  mesh:
    scan_id: 65
    scene_root: data/dtu/scan65

output:
  dir: outputs/exmesh/reproduction/dtu/scan65
  metrics_file: outputs/exmesh/reproduction/dtu/scan65/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan65/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan65/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan65/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan65/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan65/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan65/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan65/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan65/profile.json

render:
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan65/video
