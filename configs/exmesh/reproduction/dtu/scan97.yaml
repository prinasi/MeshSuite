_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan97

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.01

eval:
  mesh:
    scan_id: 97
    scene_root: data/dtu/scan97

output:
  dir: outputs/exmesh/reproduction/dtu/scan97
  metrics_file: outputs/exmesh/reproduction/dtu/scan97/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan97/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan97/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan97/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan97/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan97/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan97/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan97/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan97/profile.json

render:
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan97/video
