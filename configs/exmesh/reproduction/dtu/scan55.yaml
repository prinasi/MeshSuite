_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan55
  dtu_eval_mode: foreground
  eval_split: true
  eval_every: 8

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.01

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan55/video

eval:
  split: test
  mesh:
    scan_id: 55
    scene_root: data/dtu/scan55

output:
  dir: outputs/exmesh/reproduction/dtu/scan55
  metrics_file: outputs/exmesh/reproduction/dtu/scan55/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan55/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan55/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan55/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan55/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan55/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan55/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan55/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan55/profile.json
