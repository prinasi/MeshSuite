_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan83
  dtu_eval_mode: foreground
  eval_split: true
  eval_every: 8

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.01

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan83/video

eval:
  split: test
  mesh:
    scan_id: 83
    scene_root: data/dtu/scan83

output:
  dir: outputs/exmesh/reproduction/dtu/scan83
  metrics_file: outputs/exmesh/reproduction/dtu/scan83/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan83/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan83/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan83/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan83/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan83/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan83/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan83/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan83/profile.json
