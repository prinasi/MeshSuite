_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan118
  dtu_eval_mode: foreground
  eval_split: true
  eval_every: 8

trainer:
  lambda_smooth: 1000
  lambda_depth: 0.01

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan118/video

eval:
  split: test
  mesh:
    scan_id: 118
    scene_root: data/dtu/scan118

output:
  dir: outputs/exmesh/reproduction/dtu/scan118
  metrics_file: outputs/exmesh/reproduction/dtu/scan118/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan118/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan118/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan118/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan118/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan118/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan118/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan118/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan118/profile.json
