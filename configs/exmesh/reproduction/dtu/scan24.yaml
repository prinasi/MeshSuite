_base_: ../../../base/exmesh_paper_dtu.yaml

dataset:
  scene: scan24
  dtu_eval_mode: foreground
  eval_split: true
  eval_every: 8

trainer:
  lambda_smooth: 3000
  lambda_depth: 0.1

render:
  split: test
  video:
    output_dir: outputs/exmesh/reproduction/dtu/scan24/video

eval:
  split: test
  mesh:
    scan_id: 24
    scene_root: data/dtu/scan24

output:
  dir: outputs/exmesh/reproduction/dtu/scan24
  metrics_file: outputs/exmesh/reproduction/dtu/scan24/metrics.json
  mesh_metrics_file: outputs/exmesh/reproduction/dtu/scan24/mesh_metrics.json
  mesh_file: outputs/exmesh/reproduction/dtu/scan24/mesh/mesh.ply
  stats_file: outputs/exmesh/reproduction/dtu/scan24/stats.json
  report_file: outputs/exmesh/reproduction/dtu/scan24/report.md

adapter:
  checkpoint: outputs/exmesh/reproduction/dtu/scan24/ckpt/final.pt

mesh:
  output: outputs/exmesh/reproduction/dtu/scan24/mesh/mesh.ply

inspect:
  output: outputs/exmesh/reproduction/dtu/scan24/stats.json

profile:
  output: outputs/exmesh/reproduction/dtu/scan24/profile.json
